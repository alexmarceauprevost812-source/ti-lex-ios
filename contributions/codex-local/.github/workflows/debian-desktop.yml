name: Vérification Debian et GTK
on:
  push:
    branches: [ti-lex-ios]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances de vérification
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 librsvg2-common xvfb xauth dbus-x11 desktop-file-utils xfce4-terminal plymouth plymouth-themes plymouth-x11
      - name: Vérifier les paquets du manifeste
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for path in Path("debian13/config/package-lists").glob("*.list.chroot"):
              for package in path.read_text().splitlines():
                  if package and not package.startswith("#"):
                      subprocess.run(["apt-cache", "show", package], stdout=subprocess.DEVNULL, check=True)
          PY
      - name: Vérifier les lanceurs et le shell
        run: |
          desktop-file-validate debian13/config/includes.chroot/usr/share/applications/*.desktop
          bash -n debian13/config/includes.chroot/usr/local/bin/ti-lex-terminal
          bash -n debian13/config/includes.chroot/usr/local/bin/ti-lex-open
          bash -n debian13/config/includes.chroot/usr/share/ti-lex/terminal/bashrc
      - name: Vérifier les fenêtres GTK
        run: |
          cp -r debian13/config/includes.chroot/usr/share/ti-lex /usr/share/
          xvfb-run -a dbus-run-session -- python3 debian13/tests/smoke_gtk.py
      - name: Vérifier le thème de démarrage sous X11
        run: |
          cp -r debian13/config/includes.chroot/usr/share/plymouth/themes/ti-lex /usr/share/plymouth/themes/
          cp /usr/share/ti-lex/branding/mascot.png /usr/share/plymouth/themes/ti-lex/
          plymouth-set-default-theme ti-lex
          xvfb-run -a sh debian13/tests/smoke-plymouth.sh
      - name: Conserver le diagnostic du thème
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plymouth-check
          path: |
            /tmp/ti-lex-plymouth.log
            /tmp/ti-lex-plymouth.png
