[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ti-lex-iso-builder"
version = "0.1.0"
description = "Constructeur Python de la distribution Linux TI-LEX"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}

[project.scripts]
ti-lex-build = "ti_lex_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
