name: Vérification Python
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src
      - run: python -m pip install .
      - run: ti-lex-build --help
